<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="DomaniEnergy is building a brighter, more thoughtful future for energy."
    />
    <meta name="theme-color" content="#090b09" />
    <title>DomaniEnergy — A brighter energy future</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #090b09;
        color: #f2f3ed;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        --muted: #a0a59d;
        --accent: #c8f169;
        --line: rgb(255 255 255 / 10%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        margin: 0;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page {
        position: relative;
        overflow: hidden;
        min-height: 100vh;
        background:
          radial-gradient(ellipse at 74% 29%, rgb(85 112 44 / 13%), transparent 35%),
          #090b09;
      }

      .container {
        width: min(1120px, calc(100% - 48px));
        margin-inline: auto;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 88px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 11px;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.035em;
      }

      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 6px;
        background: var(--accent);
        color: #10130b;
      }

      .nav-link {
        color: #d7d9d2;
        font-size: 13px;
        transition: color 160ms ease;
      }

      .nav-link:hover,
      .nav-link:focus-visible {
        color: var(--accent);
      }

      .hero {
        position: relative;
        display: grid;
        min-height: min(700px, calc(100svh - 88px));
        align-items: center;
        padding-block: 96px 112px;
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        max-width: 700px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 26px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 22px;
        height: 1px;
        background: currentcolor;
        content: "";
      }

      h1 {
        max-width: 740px;
        margin: 0;
        font-size: clamp(3.6rem, 8.4vw, 7.3rem);
        font-weight: 520;
        letter-spacing: -0.085em;
        line-height: 0.96;
      }

      h1 span {
        color: var(--accent);
      }

      .intro {
        max-width: 440px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: clamp(15px, 1.6vw, 17px);
        line-height: 1.75;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 26px;
        margin-top: 38px;
      }

      .button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 19px;
        border: 1px solid var(--accent);
        border-radius: 3px;
        background: var(--accent);
        color: #10130b;
        font-size: 13px;
        font-weight: 650;
        transition:
          background 160ms ease,
          color 160ms ease;
      }

      .button:hover,
      .button:focus-visible {
        background: transparent;
        color: var(--accent);
      }

      .button span {
        font-size: 17px;
        line-height: 1;
      }

      .text-link {
        color: #d7d9d2;
        font-size: 13px;
      }

      .text-link span {
        margin-left: 5px;
        color: var(--accent);
      }

      .orbit {
        position: absolute;
        top: 50%;
        right: -9%;
        width: min(53vw, 610px);
        aspect-ratio: 1;
        transform: translateY(-50%);
        pointer-events: none;
      }

      .orbit::before,
      .orbit::after {
        position: absolute;
        inset: 8%;
        border: 1px solid rgb(200 241 105 / 13%);
        border-radius: 50%;
        content: "";
      }

      .orbit::after {
        inset: 21%;
        border-color: rgb(255 255 255 / 9%);
      }

      .orbit-core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 43%;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgb(200 241 105 / 12%), transparent 68%);
      }

      .orbit-core::after {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 11px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: var(--accent);
        box-shadow:
          0 0 24px 8px rgb(200 241 105 / 25%),
          0 0 70px 28px rgb(200 241 105 / 10%);
        content: "";
      }

      .orbit-dot {
        position: absolute;
        top: 17%;
        right: 17%;
        width: 7px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 20px 5px rgb(200 241 105 / 30%);
      }

      .principles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid var(--line);
      }

      .principle {
        padding: 28px 32px 35px 0;
      }

      .principle + .principle {
        padding-left: 32px;
        border-left: 1px solid var(--line);
      }

      .principle-label {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .principle h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 520;
        letter-spacing: -0.025em;
      }

      .principle p {
        max-width: 270px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .team {
        padding-block: 88px 96px;
        border-top: 1px solid var(--line);
      }

      .team-heading {
        max-width: 500px;
        margin-bottom: 36px;
      }

      .team-heading .eyebrow {
        margin-bottom: 16px;
      }

      .team-heading h2 {
        margin: 0;
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 520;
        letter-spacing: -0.07em;
        line-height: 1;
      }

      .team-heading > p:last-child {
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.7;
      }

      .team-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        max-width: 760px;
      }

      .team-member img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        border: 1px solid var(--line);
        border-radius: 3px;
        background: #171a16;
        object-fit: cover;
      }

      .team-member h3 {
        margin: 16px 0 0;
        font-size: 17px;
        font-weight: 520;
        letter-spacing: -0.025em;
      }

      .footer {
        display: flex;
        min-height: 74px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-top: 1px solid var(--line);
        color: #777d74;
        font-size: 11px;
      }

      .footer p {
        margin: 0;
      }

      @media (max-width: 700px) {
        .container {
          width: min(100% - 40px, 540px);
        }

        .topbar {
          min-height: 72px;
        }

        .hero {
          min-height: auto;
          padding-block: 110px 100px;
        }

        .orbit {
          top: 8%;
          right: -46%;
          width: 90vw;
          transform: none;
          opacity: 0.6;
        }

        .hero-copy {
          max-width: 590px;
        }

        h1 {
          font-size: clamp(3.5rem, 13vw, 5.7rem);
        }

        .principles {
          grid-template-columns: 1fr;
        }

        .principle,
        .principle + .principle {
          padding: 22px 0;
          border-left: 0;
        }

        .principle + .principle {
          border-top: 1px solid var(--line);
        }

        .principle p {
          max-width: 400px;
        }

        .team {
          padding-block: 64px 72px;
        }
      }

      @media (max-width: 420px) {
        .team-grid {
          grid-template-columns: 1fr;
          max-width: 360px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="container topbar">

          <span class="brand-mark" aria-hidden="true">

      <footer class="container footer">
        <p>© <span id="year">2026</span> DomaniEnergy</p>

    </div>

      document.getElementById("year").textContent = new Date().getFullYear();

  </body>
</html>
